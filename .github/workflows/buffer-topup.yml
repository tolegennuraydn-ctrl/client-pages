name: Buffer top-up
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: buffer-topup
jobs:
  topup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fill the Buffer queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python .github/scripts/buffer_topup.py
      - name: Save what was scheduled
        if: always()
        run: |
          git config user.name "buffer-topup"
          git config user.email "actions@users.noreply.github.com"
          git add -A '*/posting/queue.json'
          git diff --cached --quiet || (git commit -m "Buffer top-up: queue updated" && git push)
