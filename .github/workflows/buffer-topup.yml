name: Buffer top-up
# One step per client, each with ONLY its own key (repository secret BUFFER_KEY_<CLIENT>): every client has its own Buffer account. A client without a saved secret is skipped. Changed only from Nur's main chat (client chats cannot edit .github/).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: buffer-topup
jobs:
  topup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LetsChina
        id: letschina
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_KEY_LETSCHINA || secrets.BUFFER_API_KEY }}
          OWN_HANDLES: lets_china_
        run: python .github/scripts/buffer_topup.py letschina-c84c4d57d714
      - name: Goldberry
        id: goldberry
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_KEY_GOLDBERRY }}
          OWN_HANDLES: almaty.goldberry
        run: python .github/scripts/buffer_topup.py goldberry-0fe7ba28e2eb
      - name: Diamond Beauty ATX
        id: diamond
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_KEY_DIAMOND_BEAUTY_ATX }}
          OWN_HANDLES: diamondbeauty_atx
        run: python .github/scripts/buffer_topup.py diamond-beauty-atx-804f53e95f7f
      - name: Save what was scheduled
        if: always()
        run: |
          git config user.name "buffer-topup"
          git config user.email "actions@users.noreply.github.com"
          git add -A '*/posting/queue.json' '*/posting/buffer_channels.json'
          git diff --cached --quiet || (git commit -m "Buffer top-up: queue updated" && git pull --rebase -q && git push)
      - name: Fail if a client failed
        if: steps.letschina.outcome == 'failure' || steps.goldberry.outcome == 'failure' || steps.diamond.outcome == 'failure'
        run: exit 1
